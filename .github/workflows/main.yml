name: Build Sanju Security OS ISO

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    tags: ['v*']            # also builds + publishes a Release when you push a tag like v0.1

permissions:
  contents: write           # needed to attach the ISO to a Release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Build ISO inside Debian 12 (bookworm) container
        run: |
          mkdir -p build
          chmod +x scripts/*.sh tools/*.sh 2>/dev/null || true
          find config -type f \( -name '*.hook.*' -o -path '*/usr/local/*' -o -name '*.desktop' -o -name '*.py' \) -exec chmod +x {} +
          docker run --rm --privileged -v "$PWD":/work -w /work debian:bookworm bash -euxc '
            apt-get update
            apt-get install -y sudo
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/builder
            chown -R builder:builder /work
            su builder -c "cd /work && ./scripts/01-install-deps.sh && ./scripts/07-apply-branding.sh && ([ ! -f tools/phase5-iso.sh ] || bash tools/phase5-iso.sh /work) && ./scripts/02-configure.sh && ./scripts/03-build.sh"
            su builder -c "cd /work && ./scripts/08-verify-iso.sh" || true
          '
          ls -lh build/*.iso

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sanju-security-os-iso
          path: |
            build/*.iso
            build/*.sha256
            build/build.log
          retention-days: 7
          compression-level: 0

      - name: Publish Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.iso
            build/*.sha256
